name: Work slice
description: One change that fits in one pull request
labels: ["needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence on what should be true afterwards.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check someone can run. Where it fits, include a planted fault that must fail first.
    validations:
      required: true
  - type: input
    id: paths
    attributes:
      label: Paths it will touch
      description: Two in-progress Issues may not share paths unless one is blocked by the other.
    validations:
      required: true
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      description: Issue numbers, or "none".
  - type: textarea
    id: out
    attributes:
      label: Out of scope
