name: infra

# Validates infrastructure changes (PLAN.md D23): format, `validate` of the account root and of every module, and an IaC
# misconfiguration scan. Nothing here applies or plans: with Floci gone (PLAN.md D63) there is no AWS for CI to apply to,
# and only the owner runs plan and apply against the account (PLAN.md D64). The account root's offline tests run in
# scripts/check.
#
# No workflow-level path filter: the `infra` job at the bottom is the required check and must
# report even on PRs that touch no infrastructure.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "infra=$(bash .github/scripts/changed-paths.sh "$BASE" "$GITHUB_SHA" \
            '^(infra/|\.github/(workflows/infra\.yml|scripts/changed-paths\.sh)$)')" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OpenTofu at the version and checksum in mise.lock, and the shared environment from mise.toml (PLAN.md D25).
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: opentofu

      - name: Format
        run: tofu fmt -check -recursive -diff infra

      # Modules have no caller until the session root is written, so each is validated on its own.
      - name: Validate the account root and every module
        run: |
          for dir in infra/account infra/modules/*/; do
            echo "::group::$dir"
            (cd "$dir" && tofu init -input=false -backend=false && tofu validate)
            echo "::endgroup::"
          done

  # Misconfigurations in the OpenTofu code (Trivy's IaC checks, the successor of tfsec). Report-only: findings go to the
  # Security tab; the scan is advisory until the session root exists.
  misconfig:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same locked Trivy as the image gate and the rescan (PLAN.md D25), not a third-party action.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: trivy

      - run: trivy config --format sarif --output trivy-config.sarif --exit-code 0 infra

      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config-infra

  # The single required check. Runs even when nothing changed or a job failed.
  infra:
    needs: [changes, validate, misconfig]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          MISCONFIG: ${{ needs.misconfig.result }}
        run: |
          echo "changes=$CHANGES validate=$VALIDATE misconfig=$MISCONFIG"
          [ "$CHANGES" = "success" ] || exit 1
          for r in "$VALIDATE" "$MISCONFIG"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
