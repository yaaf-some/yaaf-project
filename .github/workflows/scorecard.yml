name: scorecard

# OpenSSF Scorecard (PLAN.md D24): scores the repository's supply-chain practices (pinned dependencies, token permissions,
# dangerous workflows, branch protection, SAST, and more) and publishes the result to the public Scorecard API.
# Publishing requires this exact shape: no workflow-level write permissions, env or defaults, and only approved actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
      id-token: write # prove to the Scorecard API that this workflow produced the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
