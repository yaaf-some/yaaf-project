# Tool versions, shared values and tasks. CI installs the same file from mise.lock.
# Bump deliberately in a chore/ PR: `mise upgrade --bump`, then `mise lock`.

[tools]
kubectl = "1.36"
gh = "2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
zizmor = "1.30.1"
kubeconform = "0.8.0"
trivy = "0.75.0"

[vars]
# The Kubernetes minor the manifests are validated against.
k8s_version = "1.36"

[env]
K8S_VERSION = "{{ vars.k8s_version }}"

[tasks.check]
description = "The fast checks; CI runs the same script with --ci"
run = "bash scripts/check"
